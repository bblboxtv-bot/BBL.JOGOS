<div class="app"><section class="stage"><button id="mic" class="mic-main" onclick="toggleVoice()" aria-label="Conversar por voz">🎙</button><div class="mic-title" id="miclabel">Fale comigo</div><p class="mic-hint" id="hint">Toque uma vez para iniciar uma conversa contínua</p><label class="auto">Modo automático <input type="checkbox" id="auto" checked onchange="setAuto(this.checked)"></label></section><main class="conversation" id="feed"><div class="intro" id="intro"><span class="bot">🤖</span><p><strong>Olá! Eu sou a BBLIA.</strong><br>Digite ou fale o que você precisa. Estou aqui para ajudar.</p></div></main><div class="composer"><button id="dictate" class="dictate" onclick="dictateMessage()" aria-label="Ditado por voz">🎤</button><textarea id="prompt" rows="1" placeholder="Digite ou fale seu comando..." aria-label="Mensagem"></textarea><button id="send" class="send" onclick="sendMessage()" aria-label="Enviar">➤</button><button id="mute" class="mute" onclick="toggleMute()" aria-label="Silenciar respostas de voz">🔊</button></div><div class="status" id="status">Uso pessoal · sem limite diário de mensagens</div></div>
<div class="drawer" id="drawer" onclick="if(event.target===this)closeDrawer()"><nav class="panel"><button class="close" onclick="closeDrawer()">✕</button><h2>BBLIA</h2><button class="navbtn" onclick="openSection('images')">🎨 Criar imagem ou logomarca</button><button class="navbtn" onclick="openSection('videos')">🎬 Criar vídeo</button><button class="navbtn" onclick="openSection('plans')">💎 Planos</button><button class="navbtn" onclick="window.location.href='/wallet'">💳 Meus créditos</button><button class="navbtn" id="adminFinanceMenu" onclick="window.location.href='/wallet-admin'">💰 Financeiro e Créditos (Admin)</button><button class="navbtn" onclick="openSection('voices')">🎙️ Vozes</button><button class="navbtn" onclick="openSection('plugins')">✨ O que a BBLIA faz</button><button class="navbtn" onclick="openSection('history')">💬 Histórico</button><button class="navbtn" onclick="openSection('settings')">⚙️ Configurações</button><button class="navbtn" onclick="openSection('help')">❔ Ajuda</button><button class="navbtn" onclick="newChat();closeDrawer()">＋ Nova conversa</button><button class="navbtn" onclick="bbliaMenuLogout()" style="margin-top:24px;border-color:#a96060;color:#ffd9d9">🚪 Sair da conta</button></nav></div><dialog class="modal" id="modal"><div id="modalContent"></div><button class="subbtn" onclick="document.getElementById('modal').close()">Fechar</button></dialog><script>
let history=[];const feed=document.getElementById('feed'),prompt=document.getElementById('prompt'),send=document.getElementById('send'),status=document.getElementById('status');const usage={textContent:''};
function add(role,text){document.getElementById('intro')?.remove();const el=document.createElement('div');el.className='msg '+role;el.textContent=text;feed.append(el);feed.scrollTop=feed.scrollHeight;return el}
let currentAudio=null,voiceToken=0,unlockedAudio=null;
function unlockVoicePlayback(){if(unlockedAudio)return;const audio=new Audio();audio.setAttribute('playsinline','');audio.preload='auto';audio.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';unlockedAudio=audio;const p=audio.play();if(p&&p.catch)p.catch(()=>{});}

function stopSpeaking(){voiceToken++;if(currentAudio){currentAudio.pause();currentAudio=null}if('speechSynthesis' in window)speechSynthesis.cancel()}
async function speak(text){stopSpeaking();const token=voiceToken;const clean=String(text).replace(/https?:\/\/\S+/g,'').slice(0,350);if(!clean.trim())return;try{const response=await fetch('/api/voice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:clean,voice:voiceOptions[voiceIndex].api})});if(!response.ok)throw Error('voice unavailable');const blob=await response.blob();if(token!==voiceToken)return;const url=URL.createObjectURL(blob);const audio=unlockedAudio||new Audio();audio.src=url;audio.load();currentAudio=audio;await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>{audio.pause();reject(Error('audio timeout'))},18000);audio.onended=()=>{clearTimeout(timeout);resolve()};audio.onerror=()=>{clearTimeout(timeout);reject(Error('audio error'))};audio.play().catch(e=>{clearTimeout(timeout);reject(e)})});URL.revokeObjectURL(url);if(currentAudio===audio)currentAudio=null;return}catch(e){if(token!==voiceToken)return}if(!('speechSynthesis' in window))throw Error('Voz indisponível');await new Promise(resolve=>{const timeout=setTimeout(()=>{speechSynthesis.cancel();resolve()},18000);const u=new SpeechSynthesisUtterance(clean);u.lang='pt-BR';u.rate=selectedVoiceRate();u.pitch=voiceOptions[voiceIndex].pitch;const v=selectedVoice();if(v)u.voice=v;u.onend=()=>{clearTimeout(timeout);resolve()};u.onerror=()=>{clearTimeout(timeout);resolve()};speechSynthesis.speak(u)})}
let muted=localStorage.getItem('bblia_muted')==='1',dictation=null;
function updateMute(){const b=document.getElementById('mute');b.textContent=muted?'🔇':'🔊';b.classList.toggle('muted',muted);b.setAttribute('aria-label',muted?'Ativar respostas de voz':'Silenciar respostas de voz')}
function toggleMute(){unlockVoicePlayback();muted=!muted;localStorage.setItem('bblia_muted',muted?'1':'0');updateMute();if(realtimeAudio)realtimeAudio.muted=muted;if(muted)stopSpeaking();status.textContent=muted?'Voz silenciada':'Respostas por voz ativadas'}
function dictateMessage(){unlockVoicePlayback();if(voiceMode){status.textContent='Encerre a conversa contínua antes de ditar uma mensagem';return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='Ditado indisponível neste navegador. Use o microfone do teclado.';return}if(dictation){dictation.stop();status.textContent='Finalizando sua mensagem...';return}try{const rec=new SR();dictation=rec;rec.lang='pt-BR';rec.interimResults=false;rec.continuous=false;let spoken='';const btn=document.getElementById('dictate');btn.classList.add('listening');status.textContent='🎤 Estou ouvindo sua mensagem';rec.onresult=e=>{spoken=e.results[0][0].transcript.trim();prompt.value=spoken;status.textContent='Mensagem reconhecida. Enviando...'};rec.onerror=e=>{status.textContent=e.error==='not-allowed'?'Autorize o microfone no navegador':'Não foi possível reconhecer a fala'};rec.onend=()=>{if(dictation===rec)dictation=null;btn.classList.remove('listening');if(spoken)sendMessage()};rec.start()}catch(e){dictation=null;document.getElementById('dictate').classList.remove('listening');status.textContent='Ditado indisponível'}}

updateMute();
let voiceMode=false,recognition=null,waitingVoice=false;
function setVoiceUI(){const b=document.getElementById('mic');b.classList.toggle('active',voiceMode);document.getElementById('miclabel').textContent=voiceMode?'Parar conversa':'Fale comigo';document.getElementById('mic').textContent=voiceMode?'■':'🎙'}
let voiceListenTimer=null,voiceRestartTimer=null;
function clearVoiceTimers(){clearTimeout(voiceListenTimer);clearTimeout(voiceRestartTimer);voiceListenTimer=null;voiceRestartTimer=null}
function scheduleVoiceListen(delay=250){clearTimeout(voiceRestartTimer);if(!voiceMode||waitingVoice||realtimePC||realtimeConnecting)return;voiceRestartTimer=setTimeout(()=>{voiceRestartTimer=null;if(voiceMode&&!waitingVoice)listenVoice()},delay)}
function listenVoice(){
 if(!voiceMode||waitingVoice||recognition||realtimePC||realtimeConnecting)return;
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){status.textContent='Reconhecimento de voz indisponível neste navegador. Abra no Safari.';voiceMode=false;setVoiceUI();return}
 const rec=new SR();recognition=rec;let gotSpeech=false;
 rec.lang='pt-BR';rec.continuous=false;rec.interimResults=false;
 rec.onresult=e=>{if(rec!==recognition||gotSpeech)return;const spoken=e.results[0][0].transcript.trim();if(!spoken)return;gotSpeech=true;clearTimeout(voiceListenTimer);waitingVoice=true;recognition=null;prompt.value=spoken;status.textContent='Enviando sua pergunta...';try{rec.stop()}catch(err){}sendMessage()};
 rec.onerror=e=>{clearTimeout(voiceListenTimer);if(e.error==='not-allowed'||e.error==='service-not-allowed'){voiceMode=false;status.textContent='Permita o microfone no navegador';setVoiceUI()}else if(voiceMode&&!waitingVoice){status.textContent='Reconectando o microfone...'}};
 rec.onend=()=>{clearTimeout(voiceListenTimer);if(rec===recognition)recognition=null;if(voiceMode&&!waitingVoice&&document.getElementById('auto').checked)scheduleVoiceListen(350)};
 try{rec.start();status.textContent='🎙️ Pode falar. Estou ouvindo.';voiceListenTimer=setTimeout(()=>{if(rec===recognition&&!gotSpeech&&!waitingVoice){status.textContent='Reativando o microfone...';try{rec.abort()}catch(e){recognition=null;scheduleVoiceListen(350)}}},9500)}

const realtimeMediaCalls=new Set();
async function handleRealtimeMedia(call,channel){
 if(realtimeMediaCalls.has(call.call_id))return;realtimeMediaCalls.add(call.call_id);
 let result;
 try{
  const args=JSON.parse(call.arguments||'{}');
  if(!['image','video'].includes(args.kind)||typeof args.prompt!=='string')throw Error('Descrição de mídia inválida.');
  if(send.disabled)result={status:'failed',error:'Aguarde a criação atual terminar.'};
  else{const refs=typeof attachments!=='undefined'&&attachments.length?attachments:(typeof currentChat==='function'?currentChat()?.files||[]:[]);result=await submitMedia(args.kind,args.prompt,args.kind==='video'?refs.find(f=>f.type==='image')||null:null)}
 }catch(e){result={status:'failed',error:e.message}}
 if(channel.readyState==='open'){
  channel.send(JSON.stringify({type:'conversation.item.create',item:{type:'function_call_output',call_id:call.call_id,output:JSON.stringify(result)}}));
  channel.send(JSON.stringify({type:'response.create'}));
 }
}
function submitMedia(kind,text,reference=null){add('user',text);return generateMedia(kind,text,null,reference)}
function mediaIntent(text){
 const t=text.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 const request=/\b(cri(?:e|ar|a)|ger(?:e|ar|a)|fac(?:a|er)|faz(?:er)?|produz(?:a|ir)?|desenh(?:e|ar|a)|monte|montar|quero|preciso)\b/;
 if(/\b(nao (?:crie|gere|faca)|como (?:criar|gerar|fazer)|tutorial|quanto custa|voce (?:consegue|pode) criar)\b/.test(t)&&!/^voce (consegue|pode) criar .+ (para|pra) mim/.test(t))return null;
 if(!request.test(t))return null;
 if(/\b(video|videos|clipe|animacao)\b/.test(t))return 'video';
 if(/\b(imagem|imagens|foto|fotos|fotografia|logomarca|logo|ilustracao|arte|banner|desenho)\b/.test(t))return 'image';
 return null;
}
function mediaFailure(bubble,kind,text,error){
 const raw=String(error?.message||error||'');
 const message=/[<>]|Unexpected token|JSON|SyntaxError|Traceback/i.test(raw)||raw.length>350?'Não foi possível entregar o vídeo ou a imagem. Tente novamente.':raw;

}

 document.body.classList.add('media-visible');bubble.replaceChildren();const isVideo=data.kind==='video';const media=document.createElement(isVideo?'video':'img');
 media.style.cssText='display:block;width:100%;max-width:500px;border-radius:14px';
 const hint=document.createElement('p');hint.className='muted';
 if(isVideo){
  media.controls=true;media.playsInline=true;media.preload='auto';media.style.aspectRatio='16 / 9';media.style.background='#000';media.setAttribute('aria-label','Vídeo criado pela BBLIA');

  media.onerror=()=>{hint.textContent='O vídeo não carregou. Use Abrir vídeo ou tente recarregar o player.';status.textContent='Falha ao carregar o vídeo'};

  animate.onclick=async()=>{if(send.disabled)return;const movement=prompt.value.trim()||'The same character from the reference image moves and dances naturally. Preserve the face, clothes, art style and background. Smooth motion, static camera.';prompt.value='';await submitMedia('video',movement,{name:'reference.png',type:'image',data:data.image})};
  bubble.append(animate);
 }

 const link=document.createElement('a');link.href=media.src;link.download=isVideo?'bblia-video.mp4':'bblia-imagem.png';link.textContent=isVideo?'▶ Abrir vídeo':'⬇ Salvar imagem';link.style.cssText='display:block;padding:12px;color:#ffdc88';

  const reload=document.createElement('button');reload.className='subbtn';reload.textContent='Recarregar vídeo';reload.onclick=()=>{media.load();hint.textContent='Carregando o vídeo...'};bubble.append(hint,reload);
 }

async function pollMedia(id,bubble,text){

  let response,data;
  try{response=await fetch('/api/media/jobs/'+encodeURIComponent(id));data=await response.json();failures=0}catch(e){if(++failures>=5)throw Error('Conexão interrompida. Reabra a página para consultar a criação.');await new Promise(r=>setTimeout(r,3000));continue}
  if(!response.ok)throw Error(data.error||'Não foi possível consultar a criação.');
  if(data.status==='failed'){localStorage.removeItem('bblia_pending_media');throw Error(data.error||'Falha na criação.')}
  if(data.status==='completed'){renderMedia(bubble,data,text);localStorage.removeItem('bblia_pending_media');status.textContent=data.kind==='video'?'Vídeo gerado · toque em ▶':'Imagem criada';return data}

  const response=await fetch('/api/media/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,prompt:text,reference})});
  const data=await response.json();if(!response.ok)throw Error(data.error||'Não foi possível iniciar a criação.');
  localStorage.setItem('bblia_pending_media',JSON.stringify({id:data.id,text,kind}));

  status.textContent='Criação em andamento';const generated=await pollMedia(data.id,bubble,text);

}
async function resumeMedia(){

</style><script>
(function(){
 function fitViewport(){document.documentElement.style.setProperty('--bblia-viewport',Math.round(window.visualViewport?.height||window.innerHeight)+'px')}
 const promptField=document.getElementById('prompt');
 function updateKeyboardLayout(){
  const viewport=window.visualViewport;
  const keyboardVisible=!!viewport&&viewport.height<window.innerHeight-120;
  document.body.classList.toggle('bblia-keyboard-open',document.activeElement===promptField&&keyboardVisible);
 }
 function refreshViewport(){fitViewport();updateKeyboardLayout()}
 fitViewport();window.addEventListener('resize',refreshViewport);
 if(window.visualViewport)window.visualViewport.addEventListener('resize',refreshViewport);
 if(promptField){promptField.addEventListener('focus',refreshViewport);promptField.addEventListener('blur',()=>document.body.classList.remove('bblia-keyboard-open'))}
})();
</script></body></html>
