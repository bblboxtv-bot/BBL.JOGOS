<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d13"><meta name="apple-mobile-web-app-capable" content="yes"><title>BBLIA — Sua inteligência</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Arial;background:#0b0d13;color:#f3f0e7}*{box-sizing:border-box}body{margin:0}header{padding:19px 18px;border-bottom:1px solid #2c2a28;display:flex;align-items:center;justify-content:space-between;background:#10121a}.brand{font-size:25px;font-weight:850;letter-spacing:2px;color:#e7c16a}.tag{font-size:11px;color:#b6a47b}.wrap{max-width:850px;margin:auto;display:flex;flex-direction:column;height:calc(100dvh - 75px)}main{flex:1;overflow:auto;padding:22px 16px}.intro{text-align:center;margin:15vh auto 0;max-width:420px}.intro h1{font-size:32px;margin:0;color:#e7c16a}.intro p{color:#b5b4bb;line-height:1.5}.msg{white-space:pre-wrap;line-height:1.55;padding:14px 17px;border-radius:17px;margin:13px 0;max-width:90%;overflow-wrap:anywhere}.user{background:#333044;margin-left:auto}.assistant{background:#1b1e29;border:1px solid #33343d;margin-right:auto}.bar{padding:12px 15px max(16px,env(safe-area-inset-bottom));border-top:1px solid #2c2a28;background:#10121a}.composer{display:flex;gap:10px;align-items:end}textarea{flex:1;background:#20232f;color:white;border:1px solid #47424a;border-radius:14px;padding:13px;font:inherit;resize:none;min-height:50px;max-height:150px}button{background:#d9ae52;color:#17140e;border:0;border-radius:13px;padding:14px 17px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.sub{display:flex;justify-content:space-between;color:#aaa4a1;font-size:12px;padding:7px 3px 0}.small{background:transparent;color:#d9ae52;border:1px solid #655633;padding:8px 10px;font-size:12px}dialog{border:1px solid #655633;border-radius:18px;background:#181b25;color:white;max-width:calc(100vw - 32px);width:min(360px,calc(100vw - 32px));padding:18px;max-height:calc(100dvh - 48px);overflow:auto;overflow-wrap:anywhere;font-size:16px}dialog input{display:block;min-width:0;width:100%;padding:12px;background:#282b36;color:white;border:1px solid #555;border-radius:10px;margin:12px 0}dialog p{font-size:14px;line-height:1.5}dialog h3{font-size:20px;line-height:1.3;margin:0 0 10px}dialog button{font-size:14px;padding:11px 13px;margin-bottom:4px}@media(max-width:480px){header{padding:14px 12px;gap:8px}.brand{font-size:22px}.tag{font-size:9px}.small{padding:8px;font-size:11px}.msg{max-width:95%;font-size:15px}main{padding:14px 12px}}  .voice-button{display:flex;align-items:center;gap:7px;justify-content:center;background:#d9ae52;color:#15120b;border:2px solid #f1d287;border-radius:16px;padding:12px 14px;min-height:52px;font-size:14px;box-shadow:0 3px 12px #d9ae5230}.voice-button.active{background:#8d333c;color:white;border-color:#ee8790}.composer{align-items:center}.composer textarea{min-width:0}.composer #send{min-height:52px}@media(max-width:480px){.voice-button{padding:10px;flex-direction:column;gap:0;font-size:11px;min-width:75px}.composer{gap:7px}.composer #send{padding:13px 12px}} </style></head><body>
<header><div><div class="brand">BBL<span style="color:white">IA</span></div><div class="tag">INTELIGÊNCIA QUE ENTREGA</div></div><div><button class="small" onclick="newChat()">Nova conversa</button></div></header>
<div class="wrap"><main id="feed"><div class="intro" id="intro"><h1>Como posso ajudar?</h1><p>Peça uma resposta, uma ideia ou ajuda com programação. Sem enrolação.</p></div></main><div class="bar"><div class="composer"><textarea id="prompt" rows="1" placeholder="Digite seu pedido..." aria-label="Mensagem"></textarea><button class="voice-button" id="mic" onclick="toggleVoice()" title="Conversar por voz" aria-label="Conversar por voz"><span id="micicon">🎙️</span><span id="miclabel">Conversar</span></button><button id="send" onclick="sendMessage()">Enviar</button></div><div class="sub"><span id="status">BBLIA • Teste grátis · 3 mensagens/dia · voz experimental</span><span id="usage"></span></div></div></div>

<script>
let history=[];const feed=document.getElementById('feed'),prompt=document.getElementById('prompt'),send=document.getElementById('send'),status=document.getElementById('status'),usage=document.getElementById('usage');
function add(role,text){document.getElementById('intro')?.remove();let el=document.createElement('div');el.className='msg '+role;el.textContent=text;feed.append(el);feed.scrollTop=feed.scrollHeight;return el}
function speak(text){if(!('speechSynthesis' in window)){alert('Leitura por voz indisponível neste navegador.');return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.rate=1;speechSynthesis.speak(u)}
let voiceMode=false,recognition=null,waitingVoice=false;
function setVoiceUI(){const b=document.getElementById('mic');b.classList.toggle('active',voiceMode);document.getElementById('miclabel').textContent=voiceMode?'Parar':'Conversar';document.getElementById('micicon').textContent=voiceMode?'⏹️':'🎙️'}
function listenVoice(){if(!voiceMode||waitingVoice)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='Use o microfone do teclado: reconhecimento de voz indisponível neste navegador';voiceMode=false;setVoiceUI();return;}try{recognition=new SR();recognition.lang='pt-BR';recognition.continuous=false;recognition.interimResults=false;recognition.onresult=e=>{const spoken=e.results[0][0].transcript;if(spoken.trim()){prompt.value=spoken;waitingVoice=true;sendMessage()}};recognition.onerror=e=>{if(e.error==='not-allowed'){voiceMode=false;setVoiceUI();status.textContent='Autorize o microfone nas configurações do navegador'}else if(voiceMode&&!waitingVoice){status.textContent='Toque em Conversar para tentar novamente'}};recognition.onend=()=>{recognition=null};recognition.start();status.textContent='🎙️ Estou ouvindo. Pode falar.'}catch(e){status.textContent='Microfone indisponível neste navegador';voiceMode=false;setVoiceUI()}}
function toggleVoice(){if(voiceMode){voiceMode=false;waitingVoice=false;try{recognition?.stop()}catch(e){};if('speechSynthesis' in window)speechSynthesis.cancel();status.textContent='Conversa por voz encerrada'}else{voiceMode=true;waitingVoice=false;listenVoice()}setVoiceUI()}
function replyByVoice(answer){if(!voiceMode)return;if(!('speechSynthesis' in window)){status.textContent='Leitura em voz alta indisponível';waitingVoice=false;return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(answer);u.lang='pt-BR';u.rate=1.07;u.onend=()=>{waitingVoice=false;if(voiceMode)listenVoice()};u.onerror=()=>{waitingVoice=false;status.textContent='Falha na voz. Toque em Conversar novamente.'};speechSynthesis.speak(u);status.textContent='🔊 BBLIA falando...'}

function newChat(){history=[];feed.innerHTML='<div class="intro" id="intro"><h1>Nova conversa</h1><p>O que vamos fazer hoje?</p></div>';usage.textContent='';status.textContent='BBLIA • Versão de teste'}
async function sendMessage(){const text=prompt.value.trim();if(!text||send.disabled)return;prompt.value='';add('user',text);history.push({role:'user',content:text});send.disabled=true;status.textContent='Processando...';const bubble=add('assistant','Consultando a BBLIA...');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history.slice(-12)})});const data=await r.json();if(!r.ok)throw Error(data.error||'Erro de conexão');bubble.textContent=data.answer;const voiceBtn=document.createElement('button');voiceBtn.className='small';voiceBtn.textContent='🔊 Ouvir resposta';voiceBtn.style.display='block';voiceBtn.style.marginTop='10px';voiceBtn.onclick=()=>speak(data.answer);bubble.append(voiceBtn);history.push({role:'assistant',content:data.answer});usage.textContent=(data.usage?.input||0)+' entrada · '+(data.usage?.output||0)+' saída';status.textContent='Resposta concluída';replyByVoice(data.answer)}catch(e){bubble.textContent='Não foi possível responder: '+e.message;history.pop();status.textContent='Falha na solicitação';waitingVoice=false}finally{send.disabled=false;prompt.focus();feed.scrollTop=feed.scrollHeight}}
prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
</script></body></html>
