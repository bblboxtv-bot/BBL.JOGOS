<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d29"><title>BBLIA — Assistente Inteligente</title><style>
:root{font-family:system-ui,-apple-system,Arial;color:#f5f3ff;background:#04091b;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 15%,#101c54 0%,#080d29 43%,#030714 85%)}button,textarea,select{font:inherit}button{cursor:pointer}header{height:116px;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #e7aa42;background:radial-gradient(ellipse at 50% 10%,#2b1a65,#0a102b 65%,#090e20)}.menu-btn{width:56px;height:56px;border:1px solid #b7955d;border-radius:19px;color:#ffdc88;background:#121833;font-size:30px}.brand{text-align:center}.brand strong{display:block;font-size:39px;font-weight:950;letter-spacing:3px;line-height:1.1;background:linear-gradient(180deg,#fff3bf 0%,#e9b85d 38%,#ad6a21 65%,#ffe49a 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 2px #000a) drop-shadow(0 0 10px #b97832aa)}.brand span{font-size:10px;display:block;letter-spacing:2px;color:#c6c7ef;margin-top:5px}.online{font-size:13px;border:1px solid #25dd8a;border-radius:25px;padding:10px;color:#e7fff2;background:#081d28}.online:before{content:'● ';color:#22e48a}.app{max-width:950px;margin:auto;min-height:calc(100dvh - 116px);display:flex;flex-direction:column}.stage{position:relative;min-height:390px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 10px 6px}.mic-main{width:210px;height:210px;border-radius:50%;border:5px solid #8ad8ff;background:radial-gradient(circle,#4525a4,#160e57 55%,#090c2a);box-shadow:0 0 15px #18a8ff,0 0 38px #7a39ff,inset 0 0 35px #422acb;color:white;font-size:104px;display:flex;align-items:center;justify-content:center}.mic-main.active{border-color:#f88b9a;box-shadow:0 0 24px #ff4a88,0 0 50px #8536ff}.mic-title{font-size:34px;font-weight:800;margin:22px 0 0}.mic-hint{color:#c8c7df;font-size:15px;margin:6px 0}.auto{position:absolute;right:14px;top:20px;background:#101735;border:1px solid #7b86c8;border-radius:16px;color:white;padding:12px;font-size:12px;max-width:105px}.auto input{accent-color:#18d88b;width:25px;height:25px;vertical-align:middle}.conversation{flex:1;min-height:130px;max-height:32dvh;overflow:auto;padding:8px 16px}.intro{display:flex;align-items:center;gap:15px;border:1px solid #0abafa;border-radius:20px;background:linear-gradient(120deg,#0d2049,#0c1532);padding:17px}.bot{font-size:50px}.intro p{line-height:1.5;margin:0}.msg{padding:15px 18px;border-radius:18px;line-height:1.5;margin:10px 0;max-width:93%;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#30254b;margin-left:auto}.assistant{background:#102343;border:1px solid #14b8ff}.composer{display:flex;align-items:center;gap:9px;padding:15px 14px max(18px,env(safe-area-inset-bottom));background:#070c22;border-top:1px solid #242b62}.composer textarea{flex:1;min-width:0;min-height:60px;max-height:130px;resize:none;padding:16px;background:#161d39;border:2px solid #566ac4;border-radius:20px;color:white}.send{height:60px;min-width:62px;background:linear-gradient(#15bdf6,#1157bb);border:1px solid #62eaff;border-radius:18px;color:white;font-size:28px}.send:disabled{opacity:.5}.status{font-size:12px;color:#adb5d5;padding:0 16px 8px;background:#070c22}.drawer{position:fixed;inset:0;z-index:10;background:#0009;display:none}.drawer.open{display:block}.panel{background:#0c1431;border-right:1px solid #5d77d9;width:min(350px,90vw);height:100%;padding:22px;overflow:auto}.panel h2{color:#f0c46c}.navbtn{display:block;width:100%;text-align:left;background:#152247;border:1px solid #364e87;color:white;padding:18px;border-radius:14px;margin:10px 0;font-weight:700}.close{float:right;background:#26365a;color:white;border:0;border-radius:12px;padding:12px}.modal{border:1px solid #5e89d3;border-radius:22px;background:#0c1532;color:white;padding:22px;width:min(440px,calc(100vw - 24px));max-height:85dvh;overflow:auto}.modal::backdrop{background:#000b}.modal h2{color:#e7c16a}.choice{display:block;width:100%;background:#182a50;color:white;border:1px solid #4764aa;padding:15px;border-radius:14px;margin:9px 0;text-align:left}.choice:disabled{opacity:.6}.muted{color:#b6bed8;font-size:14px}.subbtn{background:#e4b75f;color:#11152a;padding:12px;border:0;border-radius:12px;font-weight:700}@media(max-width:530px){header{height:94px;padding:9px}.brand strong{font-size:27px}.brand span{font-size:8px}.menu-btn{width:48px;height:48px}.online{font-size:10px;padding:8px}.app{min-height:calc(100dvh - 94px)}.stage{min-height:350px}.mic-main{width:172px;height:172px;font-size:84px}.mic-title{font-size:29px}.auto{top:15px;right:7px;padding:8px;font-size:10px;max-width:86px}.intro{padding:12px}.bot{font-size:36px}.intro p{font-size:13px}.conversation{max-height:30dvh}.composer{padding:10px}.composer textarea{min-height:56px;padding:12px}.send{min-width:55px;height:56px}}
.brand{position:relative;min-width:155px;isolation:isolate}.brand-mark{position:absolute;left:50%;top:-13px;transform:translateX(-50%);font-size:15px;color:#ffe9a8;text-shadow:0 0 12px #f3ba5e}.brand strong{font-family:Arial,system-ui,sans-serif;font-style:italic;letter-spacing:1px;font-size:42px;transform:skewX(-5deg);text-shadow:none!important;filter:drop-shadow(0 3px 0 #6a401a) drop-shadow(0 0 12px #b77c39)}.brand strong .brand-ai{font-size:inherit;letter-spacing:0;color:#e5d8ff;background:linear-gradient(180deg,#fff 5%,#b5a6ff 42%,#7859da 80%,#d7c8ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.brand .brand-tag{font-size:9px;letter-spacing:2.6px;color:#e7d5a2;font-weight:700}.brand:after{content:'';display:block;height:2px;margin:5px 12px 0;background:linear-gradient(90deg,transparent,#ffd47d,#9e7bff,transparent);box-shadow:0 0 9px #c59bff}.mic-main{position:relative;background:radial-gradient(circle at 35% 25%,#754bff 0%,#26107b 40%,#0a0d33 75%);border-color:#d2b7ff;box-shadow:0 0 0 8px #5136b72b,0 0 34px #6f42ff,0 0 65px #1d9dff55,inset 0 0 35px #6644df}.mic-main:after{content:'';position:absolute;inset:-16px;border:1px solid #927bfa66;border-radius:50%;pointer-events:none}@media(max-width:530px){.brand strong{font-size:32px}.brand .brand-tag{font-size:7px;letter-spacing:1.6px}.brand-mark{top:-12px}}.royal-brand{min-width:176px;padding:6px 12px 5px;border-radius:50% 50% 20% 20%;background:radial-gradient(ellipse at 50% 60%,#351365c9,#100c2d77 65%,transparent 75%);border-bottom:2px solid #dfab48;box-shadow:0 9px 16px -14px #f8d272}.royal-brand .royal-crown{display:block;position:relative;font-size:37px;line-height:.75;color:#ffdf79;text-shadow:0 1px 0 #fff3bf,0 3px 0 #a65b12,0 0 10px #e8a54a,0 0 17px #9342ff;transform:scaleX(1.45);margin-bottom:8px}.royal-brand strong{font-size:42px;letter-spacing:0;font-style:italic;line-height:1;background:linear-gradient(180deg,#fff7d0 0%,#ffd76b 24%,#b9751e 59%,#ffe9a3 78%,#a65b13 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(1px 3px 0 #6c3619) drop-shadow(0 0 7px #c78c43)}.royal-brand strong .brand-ai{background:linear-gradient(180deg,#fff4ff 0%,#dfb6ff 28%,#8931e9 65%,#ebbbff 90%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.royal-brand .brand-tag{font-size:8px;letter-spacing:1.5px;color:#f4e4b7}.royal-brand:after{margin:4px 10px 0;height:2px}@media(max-width:530px){header{padding:12px 10px}.royal-brand{min-width:146px;padding:6px 5px 4px}.royal-brand strong{font-size:35px}.royal-brand .royal-crown{font-size:30px}.royal-brand .brand-tag{font-size:7px;letter-spacing:1px}}</style></head><body><header><button class="menu-btn" onclick="openDrawer()" aria-label="Abrir menu">☰</button><div class="brand royal-brand" aria-label="BBLIA Inteligência Artificial"><span class="royal-crown" aria-hidden="true">♛</span><strong>BBL<span class="brand-ai">IA</span></strong><span class="brand-tag">INTELIGÊNCIA ARTIFICIAL</span></div><span class="online" id="online">Online</span></header>
<div class="app"><section class="stage"><button id="mic" class="mic-main" onclick="toggleVoice()" aria-label="Conversar por voz">🎙</button><div class="mic-title" id="miclabel">Fale comigo</div><p class="mic-hint" id="hint">Toque no microfone e converse</p><label class="auto">Modo automático <input type="checkbox" id="auto" checked onchange="setAuto(this.checked)"></label></section><main class="conversation" id="feed"><div class="intro" id="intro"><span class="bot">🤖</span><p><strong>Olá! Eu sou a BBLIA.</strong><br>Digite ou fale o que você precisa. Estou aqui para ajudar.</p></div></main><div class="composer"><textarea id="prompt" rows="1" placeholder="Digite ou fale seu comando..." aria-label="Mensagem"></textarea><button id="send" class="send" onclick="sendMessage()" aria-label="Enviar">➤</button></div><div class="status" id="status">Prévia gratuita · 3 mensagens/dia · voz experimental</div></div>
<div class="drawer" id="drawer" onclick="if(event.target===this)closeDrawer()"><nav class="panel"><button class="close" onclick="closeDrawer()">✕</button><h2>BBLIA</h2><button class="navbtn" onclick="openSection('plans')">💎 Planos</button><button class="navbtn" onclick="openSection('voices')">🎙️ Vozes</button><button class="navbtn" onclick="openSection('plugins')">✨ O que a BBLIA faz</button><button class="navbtn" onclick="openSection('history')">💬 Histórico</button><button class="navbtn" onclick="openSection('settings')">⚙️ Configurações</button><button class="navbtn" onclick="openSection('help')">❔ Ajuda</button><button class="navbtn" onclick="newChat();closeDrawer()">＋ Nova conversa</button></nav></div><dialog class="modal" id="modal"><div id="modalContent"></div><button class="subbtn" onclick="document.getElementById('modal').close()">Fechar</button></dialog><script>
let history=[];const feed=document.getElementById('feed'),prompt=document.getElementById('prompt'),send=document.getElementById('send'),status=document.getElementById('status');const usage={textContent:''};
function add(role,text){document.getElementById('intro')?.remove();let el=document.createElement('div');el.className='msg '+role;el.textContent=text;feed.append(el);feed.scrollTop=feed.scrollHeight;return el}
let currentAudio=null,voiceToken=0;
async function speak(text){const token=++voiceToken;if(currentAudio){currentAudio.pause();currentAudio=null}if('speechSynthesis' in window)speechSynthesis.cancel();const clean=String(text).replace(/https?:\/\/\S+/g,'').slice(0,350);if(!clean.trim())return;try{const response=await fetch('/api/voice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:clean,voice:voiceOptions[voiceIndex].api})});if(!response.ok)throw Error('voice unavailable');const blob=await response.blob();if(token!==voiceToken)return;const url=URL.createObjectURL(blob);const audio=new Audio(url);currentAudio=audio;audio.onended=()=>{URL.revokeObjectURL(url);if(currentAudio===audio)currentAudio=null};audio.onerror=()=>URL.revokeObjectURL(url);await audio.play();return}catch(e){if(token!==voiceToken)return}if(!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(clean);u.lang='pt-BR';u.rate=selectedVoiceRate();u.pitch=voiceOptions[voiceIndex].pitch;const v=selectedVoice();if(v)u.voice=v;speechSynthesis.speak(u)}
let voiceMode=false,recognition=null,waitingVoice=false;
function setVoiceUI(){const b=document.getElementById('mic');b.classList.toggle('active',voiceMode);document.getElementById('miclabel').textContent=voiceMode?'Parar conversa':'Fale comigo';document.getElementById('mic').textContent=voiceMode?'■':'🎙'}
function listenVoice(){if(!voiceMode||waitingVoice)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='Use o microfone do teclado: reconhecimento de voz indisponível neste navegador';voiceMode=false;setVoiceUI();return;}try{recognition=new SR();recognition.lang='pt-BR';recognition.continuous=false;recognition.interimResults=false;recognition.onresult=e=>{const spoken=e.results[0][0].transcript;if(spoken.trim()){prompt.value=spoken;waitingVoice=true;sendMessage()}};recognition.onerror=e=>{if(e.error==='not-allowed'){voiceMode=false;setVoiceUI();status.textContent='Autorize o microfone nas configurações do navegador'}else if(voiceMode&&!waitingVoice){status.textContent='Toque em Conversar para tentar novamente'}};recognition.onend=()=>{recognition=null};recognition.start();status.textContent='🎙️ Estou ouvindo. Pode falar.'}catch(e){status.textContent='Microfone indisponível neste navegador';voiceMode=false;setVoiceUI()}}
function toggleVoice(){if(voiceMode){voiceMode=false;waitingVoice=false;try{recognition?.stop()}catch(e){};if('speechSynthesis' in window)speechSynthesis.cancel();status.textContent='Conversa por voz encerrada'}else{voiceMode=true;waitingVoice=false;listenVoice()}setVoiceUI()}
function replyByVoice(answer){if(!voiceMode)return;if(!('speechSynthesis' in window)){status.textContent='Leitura em voz alta indisponível';waitingVoice=false;return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(answer);u.lang='pt-BR';u.rate=selectedVoiceRate();const v=selectedVoice();if(v)u.voice=v;u.onend=()=>{waitingVoice=false;if(voiceMode&&document.getElementById('auto').checked)listenVoice()};u.onerror=()=>{waitingVoice=false;status.textContent='Falha na voz. Toque em Conversar novamente.'};speechSynthesis.speak(u);status.textContent='🔊 BBLIA falando...'}

function newChat(){history=[];feed.innerHTML='<div class="intro" id="intro"><h1>Nova conversa</h1><p>O que vamos fazer hoje?</p></div>';usage.textContent='';status.textContent='BBLIA • Versão de teste'}
async function sendMessage(){const text=prompt.value.trim();if(!text||send.disabled)return;prompt.value='';add('user',text);let query=text;if(/mega[ -]?sena/i.test(text)&&/resultado|número|numero|dezenas|sorteio|concurso|último|ultimo/i.test(text)){send.disabled=true;const bubble=add('assistant','Consultando o resultado oficial...');try{const m=text.match(/concurso[ ]*([0-9]{3,6})/i);const res=await fetch('/api/lottery'+(m?'?contest='+m[1]:''));const data=await res.json();if(!res.ok||data.error)throw Error(data.error||'Consulta indisponível');const answer='Mega-Sena — concurso '+data.concurso+' ('+data.data+'). Dezenas: '+(data.dezenas||[]).join(' · ')+'. '+(data.acumulou?'Acumulou.':'Não acumulou.')+' Fonte: CAIXA.';bubble.textContent=answer;history.push({role:'user',content:text},{role:'assistant',content:answer});status.textContent='Resultado oficial consultado';replyByVoice(answer)}catch(e){bubble.textContent='Não consegui consultar o resultado oficial agora: '+e.message;status.textContent='Falha na consulta'}finally{send.disabled=false}return}if(/tempo|clima|previsão|previsao|temperatura|chuva/i.test(text)){try{const loc=await new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(Error('indisponivel'));navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:false,timeout:6500,maximumAge:600000})});query=text+'\\nLocalização aproximada autorizada: '+loc.coords.latitude.toFixed(2)+','+loc.coords.longitude.toFixed(2)+'. Use estas coordenadas na ferramenta de clima.'}catch(e){status.textContent='Localização não autorizada; informe a cidade se necessário'}}if(query!==text&&query.includes('Localização aproximada autorizada: ')){const coord=query.split('Localização aproximada autorizada: ')[1].split('.')[0];const match=query.match(/Localização aproximada autorizada: (-?\d+\.\d+,-?\d+\.\d+)/);if(match){send.disabled=true;const bubble=add('assistant','Consultando o tempo na sua região...');try{const response=await fetch('/api/weather?location='+encodeURIComponent(match[1]));const w=await response.json();if(!response.ok||w.error)throw Error(w.error||'Falha na previsão');const current=w.atual||{};const daily=w.proximos_dias||{};const answer='Previsão para sua região: '+current.temperature_2m+'°C agora, sensação de '+current.apparent_temperature+'°C, umidade '+current.relative_humidity_2m+'%. Máxima de '+(daily.temperature_2m_max||[])[0]+'°C e mínima de '+(daily.temperature_2m_min||[])[0]+'°C hoje. Fonte: Open-Meteo.';bubble.textContent=answer;history.push({role:'user',content:text},{role:'assistant',content:answer});status.textContent='Previsão consultada';replyByVoice(answer)}catch(e){bubble.textContent='Não consegui consultar o tempo agora: '+e.message;status.textContent='Falha na previsão'}finally{send.disabled=false}return}}history.push({role:'user',content:query});send.disabled=true;status.textContent='Processando...';const bubble=add('assistant','Consultando a BBLIA...');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history.slice(-12)})});const data=await r.json();if(!r.ok)throw Error(data.error||'Erro de conexão');bubble.textContent=data.answer;const voiceBtn=document.createElement('button');voiceBtn.className='small';voiceBtn.textContent='🔊 Ouvir resposta';voiceBtn.style.display='block';voiceBtn.style.marginTop='10px';voiceBtn.onclick=()=>speak(data.answer);bubble.append(voiceBtn);history.push({role:'assistant',content:data.answer});usage.textContent=(data.usage?.input||0)+' entrada · '+(data.usage?.output||0)+' saída';status.textContent='Resposta concluída';replyByVoice(data.answer)}catch(e){bubble.textContent='Não foi possível responder: '+e.message;history.pop();status.textContent='Falha na solicitação';waitingVoice=false}finally{send.disabled=false;prompt.focus();feed.scrollTop=feed.scrollHeight}}

const voiceOptions=[{name:'Feminina suave',rate:1,pitch:1,api:'nova'},{name:'Masculina profunda',rate:1,pitch:1,api:'onyx'},{name:'Feminina expressiva',rate:1,pitch:1,api:'shimmer'},{name:'Masculina descontraída',rate:1,pitch:1,api:'echo'}];
let voiceIndex=Number(localStorage.getItem('bblia_voice')||0);
function voices(){return ('speechSynthesis' in window)?speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('pt')).sort((a,b)=>Number(b.lang.toLowerCase()==='pt-br')-Number(a.lang.toLowerCase()==='pt-br')):[]}
function selectedVoice(){const vs=voices();if(!vs.length)return null;const female=/luciana|francisca|maria|joana|helena|female|feminina|bruna/i;const male=/daniel|felipe|ricardo|paulo|male|masculin|antonio/i;const preferred=vs.find(v=>(voiceIndex===0||voiceIndex===2?female:male).test(v.name));return preferred||vs[voiceIndex%vs.length]}
function selectedVoiceRate(){return voiceOptions[voiceIndex].rate}
function setVoice(n){if(currentAudio){currentAudio.pause();currentAudio=null}if('speechSynthesis' in window)speechSynthesis.cancel();voiceIndex=n;localStorage.setItem('bblia_voice',n);openSection('voices');speak('Olá! Esta é uma demonstração da minha voz.')}
function openDrawer(){document.getElementById('drawer').classList.add('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open')}
function setAuto(on){document.getElementById('hint').textContent=on?'Toque no microfone e converse':'Modo manual: toque para falar';}
function openSection(which){
 closeDrawer();const el=document.getElementById('modalContent');el.replaceChildren();
 const title=document.createElement('h2');const p=document.createElement('p');p.className='muted';
 const add=(text,fn,disabled=false)=>{const b=document.createElement('button');b.className='choice';b.textContent=text;b.disabled=disabled;b.onclick=fn;el.append(b)};
 if(which==='plans'){title.textContent='Planos BBLIA';p.textContent='Teste grátis: até 3 mensagens por dia. Planos pagos ainda não estão disponíveis. Os preços e a integração de pagamento serão definidos antes da venda.';el.append(title,p);add('Grátis — em teste',()=>{},true);add('Planos pagos — em preparação',()=>{},true)}
 if(which==='voices'){title.textContent='Escolha a voz';p.textContent='Quatro vozes por inteligência artificial em teste, com limite diário para controlar custos. Quando indisponíveis, o aparelho usa sua voz padrão.';el.append(title,p);voiceOptions.forEach((v,i)=>add((i===voiceIndex?'✓ ':'')+v.name,()=>setVoice(i)))}
 if(which==='history'){title.textContent='Histórico';p.textContent='As mensagens desta conversa ficam apenas nesta sessão. O histórico entre dispositivos ainda não foi implementado.';el.append(title,p);add('Nova conversa',()=>{newChat();document.getElementById('modal').close()})}
 if(which==='settings'){title.textContent='Configurações';p.textContent='A BBLIA está em fase de testes. A conversa automática depende do reconhecimento de voz do navegador.';el.append(title,p);add('Limpar conversa',()=>{newChat();document.getElementById('modal').close()})}
 if(which==='plugins'){title.textContent='Explore o que a BBLIA pode fazer';p.textContent='Escolha uma ideia para começar. Recursos em desenvolvimento aparecem identificados; você não precisa instalar plugins.';el.append(title,p);const examples=[['🔎 Pesquisar e responder','Me explique um assunto com informações confiáveis.','ready'],['✍️ Escrever e melhorar textos','Escreva uma mensagem profissional para mim.','ready'],['💡 Ideias e projetos','Me ajude a planejar um negócio e organizar as etapas.','ready'],['💻 Programar e criar aplicativos','Quero criar um aplicativo Android. Me ajude a planejar e programar.','partial'],['🎨 Criar e editar imagens','Quero transformar uma foto usando inteligência artificial.','pending'],['🎬 Criar vídeos divertidos','Quero criar um vídeo engraçado a partir de uma foto.','pending'],['🎙️ Conversar com voz natural','Quero conversar com vozes naturais.','pending'],['📄 Analisar documentos e arquivos','Quero enviar um documento para você analisar.','pending'],['🖥️ Executar tarefas no computador','Quero usar um computador autorizado para executar uma tarefa.','pending']];examples.forEach(([name,example,state])=>{const b=document.createElement('button');b.className='choice';b.textContent=name+(state==='pending'?' · Em desenvolvimento':state==='partial'?' · Assistência por texto':'');b.onclick=()=>{if(state==='pending'){const d=document.createElement('p');d.className='muted';d.textContent='Esta função ainda não está conectada. Será liberada após testes reais.';b.after(d);b.disabled=true;return}document.getElementById('modal').close();prompt.value=example;prompt.focus()};el.append(b)})}
 if(which==='help'){title.textContent='Ajuda';p.textContent='Toque no microfone para falar ou digite uma mensagem. Se o microfone não funcionar, autorize seu uso no navegador. Com o modo automático ligado, a BBLIA tenta ouvir novamente após falar. Nem todos os navegadores permitem isso.';el.append(title,p)}
 document.getElementById('modal').showModal()
}

prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
</script></body></html>
